<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il Codex di Alec</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap');
:root{--ink:#332117;--paper:#e8d0a0;--paper2:#c9a66d;--dark:#0b0705;--gold:#a97832;--gold2:#d4aa61;--red:#6f2822;--cream:#f4e5c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b0705;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif}
body{overflow-x:hidden}
button{font:inherit;touch-action:manipulation}
#app{min-height:100vh;min-height:100dvh}
.page{min-height:100vh;min-height:100dvh;padding:18px 12px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 18%,#3a2618 0%,#120b07 55%,#080503 100%)}
.codex{width:min(760px,100%);max-height:calc(100vh - 28px);overflow:auto;padding:34px 24px;border:1px solid #a87935;background:linear-gradient(115deg,#d8bc82,#f0ddb0 42%,#d3b276);box-shadow:0 0 0 7px #160d08,0 0 0 8px #8b622e,0 24px 70px #000c;position:relative}
.codex:before{content:"";position:absolute;inset:11px;border:1px solid #8d653866;pointer-events:none}.codex:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#6d421c18,#fff5 45%,#6d421c18);pointer-events:none}
.inner{position:relative;z-index:1;text-align:center}.kicker{letter-spacing:.2em;text-transform:uppercase;font-family:'Cinzel',Georgia,serif;font-size:.72rem;color:#634425;margin-bottom:14px}h1,h2,h3{font-family:'Cinzel',Georgia,serif;color:#4a2c18}h1{font-size:clamp(2.15rem,9vw,4.2rem);line-height:1.02;margin:0 0 18px;letter-spacing:.02em}h2{font-size:clamp(1.65rem,7vw,2.45rem);line-height:1.08;margin:0 0 14px}h3{font-size:1.18rem}p{font-size:1.12rem;line-height:1.48;margin:11px auto;max-width:650px}.quote{font-style:italic;color:#5e4028}.btns{display:grid;gap:12px;margin-top:24px}.btn{border:1px solid #b48745;background:#2d190f;color:#ead5a5;border-radius:0;padding:15px 14px;min-height:54px;cursor:pointer;box-shadow:0 0 0 1px #4f2d18;letter-spacing:.08em;text-transform:uppercase;font-family:'Cinzel',Georgia,serif;font-size:.9rem}.btn:active{transform:translateY(1px);background:#432414}.btn.secondary{background:#c9a66d;color:#2e1c11}.btn.gold{background:#533018}.btn.danger{background:#64221d}
.routes{display:grid;gap:14px;margin-top:22px}.route{padding:18px;border:1px solid #9a713c;background:#e4c992;text-align:left;box-shadow:inset 0 0 0 1px #f2dfb4}.route h3{margin:0 0 6px}.route p{margin:0;font-size:1rem}.route .btn{margin-top:13px;width:100%}
.status{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 15px}.status b{padding:9px 15px;border:1px solid #a77b40;background:#d9bc82;color:#3d2718;font-family:'Cinzel',Georgia,serif;font-weight:500;font-size:.83rem;letter-spacing:.04em}.progress{height:8px;background:#76512c;margin:12px 0;border:1px solid #a97832}.progress>i{display:block;height:100%;background:#c89a4b;width:0%;transition:width .2s}
.game{width:min(900px,100%);min-height:calc(100vh - 28px);min-height:calc(100dvh - 28px);padding:32px 18px 22px;display:flex;flex-direction:column;justify-content:center;border:1px solid #7e562c;background:rgba(11,7,5,.94);box-shadow:0 0 0 8px #0c0805,0 0 0 9px #8a612f,0 20px 70px #000;position:relative;color:#d9c095}.game:before{content:"";position:absolute;inset:10px;border:1px solid #754c2770;pointer-events:none}.game .kicker{color:#79552f}.game h2{color:#b77b36;font-size:clamp(1.7rem,7vw,3rem);text-shadow:0 2px 10px #000}.game .story{padding:20px 15px;border:1px solid #8b612f;background:rgba(20,12,7,.66);box-shadow:inset 0 0 25px #0008}.game .story p{max-width:730px;color:#cba96d;font-size:1.2rem}.game .route p{color:#4a2c18}.game .route h3{color:#4a2c18}.game .route .tiny{color:#5e4028}.choice-list{display:grid;gap:12px;margin-top:20px}.choice{width:100%;text-align:left;border:1px solid #a97938;background:#2a170e;padding:15px 14px;color:#d9bf8c;cursor:pointer;min-height:58px}.choice strong{display:block;margin-bottom:4px;font-family:'Cinzel',Georgia,serif;letter-spacing:.03em}.choice span{opacity:.72}.choice:active{background:#472616}.center{text-align:center}.seal{font-size:4rem;margin:8px}.hidden{display:none!important}.collection{text-align:center;margin:18px 0;padding:12px;border:1px solid #8b612f;background:#1a0f09}.seals{display:flex;justify-content:center;gap:14px;margin:10px 0}.seal-mini{display:inline-flex;width:48px;height:48px;align-items:center;justify-content:center;border:1px solid #72502d;border-radius:50%;font-size:1.45rem;color:#72502d;background:#0f0906;filter:grayscale(1);opacity:.55}.seal-mini.collected{filter:none;opacity:1;border-color:#b77b36;background:#2b170d;box-shadow:0 0 12px #b77b3640}.tiny{font-size:.8rem;color:#9b7749}.reveal{font-size:clamp(1.5rem,6vw,2.6rem);font-weight:bold;margin:18px 0;color:#b77932}.dragon{font-size:1.1rem;padding:18px;border:1px dashed #a97832;background:#1c0f09;color:#d9bd88}
#arena{position:relative;height:min(58vh,500px);min-height:320px;border:1px solid #9a6d34;background:radial-gradient(circle,#563a24,#130b07 70%);overflow:hidden;margin-top:15px;box-shadow:inset 0 0 35px #000}.target{position:absolute;width:78px;height:78px;border-radius:50%;border:2px solid #d6aa5e;background:#64251f;color:#f1d59c;font-size:1.8rem;display:grid;place-items:center;box-shadow:0 0 0 4px #c0904c55;cursor:pointer;touch-action:manipulation}.arenaText{position:absolute;inset:0;display:grid;place-items:center;color:#b89561;text-align:center;padding:30px;pointer-events:none;font-size:1.1rem}
.d20{width:150px;height:150px;margin:10px auto}.d20 button{border:0;background:transparent;padding:0;cursor:pointer}.d20 svg{width:150px;height:150px;display:block}
.music-wrap{display:flex;justify-content:flex-end;margin:-8px 0 4px}.music-toggle{border:1px solid #a97832;background:#332117;color:#f4e5c2;border-radius:999px;padding:8px 12px;font:600 .72rem Cinzel,serif;letter-spacing:.05em;cursor:pointer;touch-action:manipulation}.music-toggle:active{transform:scale(.98)}
@media(max-width:480px){.page{padding:10px}.codex{max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);min-height:0;padding:28px 14px}.codex:before{inset:6px}p{font-size:1.04rem}.route{padding:15px}.game{max-height:none;min-height:calc(100vh - 20px);min-height:calc(100dvh - 20px);padding:28px 12px 18px}.game .story{padding:16px 12px}.game .story p{font-size:1.08rem}.choice{padding:15px 13px;font-size:1rem}.btn{min-height:56px;font-size:.82rem}.target{width:82px;height:82px}}
</style>

</head>
<body>
<div id="app"></div>
<script>
/* --- CODEX MUSIC: WebAudio medieval moods, no external audio files --- */
let audioCtx=null, musicTimer=null, musicMode='ambient', musicOn=true, musicStep=0;
const MUSIC={
 ambient:{tempo:92, notes:[220,247,277,330,370,440,494,554], bass:[110,123,138,165]},
 story:{tempo:82, notes:[196,220,247,294,330,392,440,494], bass:[98,110,123,147]},
 battle:{tempo:138, notes:[146,174,196,220,261,293,330,392], bass:[73,87,98,110]},
 fate:{tempo:76, notes:[147,165,196,220,247,294,330,392], bass:[73,82,98,110]},
 oracle:{tempo:68, notes:[196,233,262,311,349,415,466,523], bass:[98,116,131,155]},
 finale:{tempo:58, notes:[110,123,147,165,196,220,247,294], bass:[55,62,73,82]}
};
function musicUI(){return '<button class="music-toggle" id="musicToggle" type="button" aria-label="Attiva o disattiva musica">♫ MUSICA</button>'}
function bindMusicUI(){const b=document.getElementById('musicToggle');if(!b)return;b.textContent=musicOn?'♫ MUSICA ON':'♫ MUSICA OFF';b.onclick=e=>{e.stopPropagation();musicOn=!musicOn;if(musicOn){startMusic();}else stopMusic();b.textContent=musicOn?'♫ MUSICA ON':'♫ MUSICA OFF';};}
function ensureAudio(){if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume();}
function tone(freq,dur,when,type='triangle',gain=.085){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(gain,when+.025);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g).connect(audioCtx.destination);o.start(when);o.stop(when+dur+.03)}
function startMusic(){if(!musicOn)return;ensureAudio();clearInterval(musicTimer);musicStep=0;const play=()=>{if(!audioCtx||!musicOn)return;const m=MUSIC[musicMode]||MUSIC.ambient;const beat=60/m.tempo;const now=audioCtx.currentTime+.03;const n=m.notes[musicStep%m.notes.length];tone(n,.34,now,'triangle',musicMode==='battle'?.11:.075);if(musicStep%4===0)tone(m.bass[(musicStep/4)%m.bass.length],.72,now,'sine',.06);if(musicMode==='battle' && musicStep%2===0)tone(m.notes[(musicStep+2)%m.notes.length]/2,.18,now,'square',.045);if(musicMode==='oracle' && musicStep%4===1)tone(m.notes[(musicStep+4)%m.notes.length]*2,.55,now+.08,'sine',.04);musicStep++;};play();const beat=60/(MUSIC[musicMode]||MUSIC.ambient).tempo;musicTimer=setInterval(play,beat*1000)}
function stopMusic(){clearInterval(musicTimer);musicTimer=null}
function musicSet(mode){musicMode=mode;if(musicOn)startMusic()}

(function(){
'use strict';
const app=document.getElementById('app');
const state={rooms:{sword:false,chronicle:false,destiny:false}};
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shell(title,body,extra=''){app.innerHTML=`<div class="page"><main class="codex"><div class="inner"><div class="kicker">Codex di Alec</div><div class="music-wrap">${musicUI()}</div><h2>${title}</h2>${body}${extra}</div></main></div>`;bindMusicUI()}
function gameShell(title,body){app.innerHTML=`<div class="page"><main class="game"><div class="kicker">🏰 Codex di Alec · cronaca interattiva</div><div class="music-wrap">${musicUI()}</div><h2>${title}</h2>${body}</main></div>`;bindMusicUI()}
function home(){musicSet('ambient');shell('Il Codex di Alec',`<p class="quote">CODICE DELLE CRONACHE PERDUTE</p><p>Qui comincia la cronaca di Alec, persona che attraversa i secoli, impugna lame forgiate nel passato e osa entrare in mondi che altri possono soltanto immaginare.</p><div class="btns"><button class="btn gold" id="open">✦ APRI IL CODEX ✦</button></div>`)}
function folio1(){musicSet('story');shell('Foglio I · Le cronache',`<p>Le pagine sono incomplete.</p><p>Si racconta di una persona che conosce la lama, la rievocazione e i mondi in cui una storia non si limita a essere raccontata: si vive.</p><p class="quote">Ma una cronaca non si completa leggendo. Si completa scegliendo.</p><div class="btns"><button class="btn gold" id="toRoutes">CONTINUA LA CRONACA →</button></div>`)}
function routes(){musicSet('ambient');const done=Object.values(state.rooms).filter(Boolean).length;let locked=done<3; const seal=(on,icon)=>`<span class="seal-mini ${on?'collected':''}" aria-label="${on?'Sigillo raccolto':'Sigillo non ancora raccolto'}">${on?icon:'◇'}</span>`; shell('Foglio II · Le tre vie',`<p>Scegli una via. Puoi affrontarle nell'ordine che preferisci.</p><div class="collection"><b>✦ SIGILLI DELLE CRONACHE ✦</b><div class="seals">${seal(state.rooms.sword,'⚔️')}${seal(state.rooms.chronicle,'📜')}${seal(state.rooms.destiny,'🎲')}</div><p class="tiny">${done}/3 vie completate</p></div><div class="routes"><section class="route"><h3>⚔️ La Sala d'Armi</h3><p>Un duello di riflessi. Colpisci il bersaglio prima che il tempo scada.</p><button class="btn" id="sword">ENTRA NELLA SALA</button></section><section class="route"><h3>📜 La Cronaca del Castello</h3><p>Un'avventura a scelta multipla. Le tue decisioni cambieranno il percorso.</p><button class="btn" id="chronicle">INIZIA LA CRONACA</button></section><section class="route"><h3>🎲 La Prova del Destino</h3><p>Un vero D20. Il dado decide se il destino ti concede il sigillo.</p><button class="btn" id="destiny">LANCIA IL DADO</button></section></div><div class="btns">${locked?`<p class="tiny">Raccogli tutti e tre i sigilli per aprire il Foglio III.</p>`:`<button class="btn gold" id="finals">✦ APRI IL FOGLIO III ✦</button>`}</div>`)}
function sword(){musicSet('battle');let hits=0,miss=0,timer=null,active=false;gameShell('Sala d’Armi',`<div class="status"><b id="score">Colpi: 0/5</b><b id="miss">Errori: 0/3</b><b id="time">Tempo: 8.0</b></div><div class="progress"><i id="bar"></i></div><div id="arena"><div class="arenaText" id="hint">Premi AVVIA DUELLO. Il bersaglio comparirà nell'arena.</div></div><div class="btns"><button class="btn gold" id="start">⚔️ AVVIA DUELLO</button><button class="btn secondary" id="back">← TORNA ALLE TRE VIE</button></div>`);const arena=document.getElementById('arena'),hint=document.getElementById('hint'),start=document.getElementById('start');function end(win){active=false;if(timer)clearInterval(timer);arena.querySelectorAll('.target').forEach(x=>x.remove());if(win){state.rooms.sword=true;hint.innerHTML='<b>DUELLO VINTO!</b><br>La lama ha parlato.';start.textContent='⚔️ GIOCA DI NUOVO';start.onclick=begin;}else{hint.innerHTML='<b>SEI STATO SCONFITTO.</b><br>La sala concede un altro tentativo.';start.textContent='↻ RIPROVA';start.onclick=begin}}function spawn(){if(!active)return;const t=document.createElement('button');t.className='target';t.type='button';t.textContent='⚔';t.style.left=(Math.random()*(arena.clientWidth-90)+7)+'px';t.style.top=(Math.random()*(arena.clientHeight-90)+7)+'px';t.addEventListener('pointerdown',e=>{e.preventDefault();if(!active)return;hits++;t.remove();document.getElementById('score').textContent=`Colpi: ${hits}/5`;if(hits>=5){end(true)}else spawn()},{passive:false});arena.appendChild(t)}function begin(){hits=0;miss=0;active=true;let left=8;start.disabled=true;hint.textContent='COLPISCI IL BERSAGLIO!';document.getElementById('score').textContent='Colpi: 0/5';document.getElementById('miss').textContent='Errori: 0/3';document.getElementById('time').textContent='Tempo: 8.0';spawn();timer=setInterval(()=>{left-=.1;document.getElementById('time').textContent='Tempo: '+Math.max(0,left).toFixed(1);document.getElementById('bar').style.width=(left/8*100)+'%';if(left<=0)end(false)},100)}arena.addEventListener('pointerdown',e=>{if(!active||e.target.classList.contains('target'))return;miss++;document.getElementById('miss').textContent=`Errori: ${miss}/3`;if(miss>=3)end(false)},{passive:true});start.onclick=begin;document.getElementById('back').onclick=routes}
const nodes={
start:{text:'Il portone del castello è chiuso. Un messaggero ti affida una lettera sigillata. “Deve arrivare al capitano prima del tramonto.” Davanti a te ci sono tre possibilità.',choices:[['Andare verso le mura','walls'],['Seguire il sentiero nel bosco','forest'],['Provare a entrare dalla cucina','kitchen']]},
walls:{text:'Sulle mura trovi una guardia. Ti squadra e indica la lettera. “Chi ti manda?”',choices:[['Dire la verità','truth'],['Inventare un nome nobile','lie'],['Chiedere di parlare con il capitano','captain']]},
forest:{text:'Nel bosco senti un rumore dietro di te. Potrebbe essere un animale. Potrebbe essere qualcuno.',choices:[['Continuare senza voltarti','continue'],['Nasconderti e osservare','hide'],['Gridare “CHI VA LÀ?”','shout']]},
kitchen:{text:'La cucina è piena di servi. Una cuoca ti nota e ti chiede perché stai cercando di passare.',choices:[['Chiedere gentilmente di passare','kind'],['Offrire una moneta','coin'],['Dire che sei l’ispettore delle torte','cake']]},
truth:{text:'La guardia ascolta. Riconosce il sigillo e ti lascia passare. Ma il capitano non è sulla torre: indica una scala che scende nei sotterranei.',choices:[['Scendere','dungeon'],['Chiedere dove porta la scala','ask']]},
lie:{text:'La guardia solleva un sopracciglio. “Certo. E io sono il re.” Ti blocca.',choices:[['Ammettere di aver mentito','truth'],['Scappare verso le scale','escape']]},
captain:{text:'La guardia annuisce. “Ottima idea.” Un soldato viene a chiamare il capitano.',choices:[['Aspettare','wait']]},
continue:{text:'Il rumore era un cervo. Poco più avanti trovi una scorciatoia che porta al castello.',choices:[['Prendere la scorciatoia','shortcut']]},
hide:{text:'Ti nascondi. Passano due esploratori del castello. Uno lascia cadere una chiave.',choices:[['Raccogliere la chiave','key'],['Lasciarla e continuare','shortcut']]},
shout:{text:'“CHI VA LÀ?” urli. Il bosco risponde con un silenzio molto giudicante. Poi senti un ramo spezzarsi.',choices:[['Correre','run'],['Restare fermo','still']]},
kind:{text:'La cuoca sorride. “Passa pure, messaggero.” Hai evitato un disastro diplomatico.',choices:[['Proseguire','hall']]},
coin:{text:'La cuoca guarda la moneta. Poi guarda te. “Ne servono due.”',choices:[['Pagare','hall'],['Rinunciare','forest']]},
cake:{text:'La cuoca ti fissa. “Ispettore delle torte?” È chiaramente la bugia peggiore mai pronunciata nel castello.',choices:[['Confessare','kind'],['Insistere','bad']]},
ask:{text:'La guardia risponde: “Al cuore del castello.” Non sembra voler aggiungere altro.',choices:[['Scendere','dungeon'],['Tornare indietro','walls']]},
escape:{text:'Corri. La guardia urla. Giri l’angolo e trovi un vicolo cieco.',choices:[['Tornare indietro','walls']]},
wait:{text:'Il capitano arriva. Guarda il sigillo, prende la lettera e sorride. Missione compiuta.',choices:[['Concludi la cronaca','win']]},
shortcut:{text:'La scorciatoia sbuca dietro il castello. Una porta secondaria è socchiusa.',choices:[['Entrare','hall']]},
key:{text:'La chiave apre una piccola porta nascosta. Dentro c’è un corridoio che porta al cuore del castello.',choices:[['Entrare','hall']]},
run:{text:'Corri e perdi la strada. Dopo qualche minuto torni esattamente al punto di partenza.',choices:[['Riprovare','start']]},
still:{text:'Rimani immobile. Il “mostro” è un gatto. Ti guarda come se avessi perso tempo prezioso.',choices:[['Seguire il gatto','shortcut']]},
hall:{text:'Nel corridoio incontri un araldo. “Se cerchi il capitano, è nella sala del trono.”',choices:[['Andare alla sala del trono','win'],['Chiedere indicazioni dettagliate','detailed']]},
detailed:{text:'L’araldo indica una porta, poi un’altra, poi una scala. In qualche modo riesci a non perderti.',choices:[['Seguire le indicazioni','win']]},
dungeon:{text:'Nei sotterranei trovi una scala nascosta che porta direttamente alla sala del trono.',choices:[['Salire','win']]},
bad:{text:'La cuoca chiama le guardie. Fine della carriera da ispettore delle torte.',choices:[['Riprovare la cronaca','start']]}
};
function destiny(){musicSet('fate');gameShell('La Prova del Destino',`<div class="story center"><div class="reveal">✦ IL DESTINO TI OSSERVA ✦</div><p>Lancia il D20. Se il risultato è <b>12 o più</b>, il sigillo sarà tuo.</p><div class="d20"><button id="rollDestiny" aria-label="Lancia il D20"><svg viewBox="0 0 160 160" role="img"><polygon points="80,8 146,52 122,132 38,132 14,52" fill="#7e2c26" stroke="#e6c477" stroke-width="5"/><path d="M80 8 80 132M14 52 122 132M146 52 38 132M14 52 146 52" stroke="#e6c477" stroke-width="3" fill="none"/><text id="destinyNumber" x="80" y="91" text-anchor="middle" font-size="34" fill="#fff2cf" font-family="Georgia">20</text></svg></button></div><p id="destinyResult" class="quote">Il dado attende.</p></div><div class="btns"><button class="btn secondary" id="destinyBack">← TORNA ALLE TRE VIE</button></div>`);document.getElementById('destinyBack').onclick=routes;document.getElementById('rollDestiny').onclick=()=>{const v=Math.floor(Math.random()*20)+1;document.getElementById('destinyNumber').textContent=v;const r=document.getElementById('destinyResult');if(v>=12){state.rooms.destiny=true;r.innerHTML='<b>✦ IL SIGILLO È TUO ✦</b><br>Il destino ha parlato a tuo favore.'}else{r.textContent='Il destino non concede ancora il sigillo. Rilancia.'}}}
function chronicle(){musicSet('story');let node='start';gameShell('La Cronaca del Castello',`<div class="status"><b id="chapter">Foglio 1</b><b>Vite: ∞</b></div><div class="story"><p id="story"></p><div class="choice-list" id="choices"></div></div><div class="btns"><button class="btn secondary" id="routeBack">← TORNA ALLE TRE VIE</button></div>`);const story=document.getElementById('story'),choices=document.getElementById('choices');function render(){const n=nodes[node];story.textContent=n.text;choices.innerHTML='';const shuffled=[...n.choices].sort(()=>Math.random()-0.5);shuffled.forEach(([label,next])=>{const b=document.createElement('button');b.className='choice';b.type='button';b.innerHTML='<strong>'+esc(label)+'</strong><span>→ Scegli questa strada</span>';b.addEventListener('click',()=>{if(next==='win'){state.rooms.chronicle=true;win();return}node=next;render()});choices.appendChild(b)});document.getElementById('chapter').textContent='Foglio '+(Object.keys(nodes).indexOf(node)+1)}function win(){story.innerHTML='<b>✦ MISSIONE COMPIUTA ✦</b><br><br>La lettera è arrivata nelle mani del capitano. La tua cronaca entra nel Codex.';choices.innerHTML='<button class="btn gold" id="again">↻ RISCRIVI LA CRONACA</button><button class="btn" id="done">TORNA ALLE TRE VIE</button>';document.getElementById('again').onclick=()=>{node='start';render()};document.getElementById('done').onclick=routes}document.getElementById('routeBack').onclick=routes;render()}
function finals(){gameShell('Foglio III · Il cuore del Codex',`<p>Le tre vie sono state percorse. I tre sigilli sono riuniti.</p><div class="routes"><section class="route"><h3>🔮 Il Piccolo Oracolo</h3><p>Un piccolo rituale del Codex. Pensa a una domanda e pesca un responso. Non devi trovare la risposta giusta: devi ascoltare il segno.</p><button class="btn" id="oracle">✦ CONSULTA L'ORACOLO ✦</button></section><section class="route"><h3>📜 La pagina conclusiva</h3><p>Hai completato il cammino. Quando sei prontə, chiudi il Codex e scopri cosa ti aspetta.</p><button class="btn gold" id="reveal">✦ CHIUDI IL CODEX ✦</button></section></div><div class="btns"><button class="btn secondary" id="rb">← TORNA ALLE TRE VIE</button></div>`);document.getElementById('rb').onclick=routes;document.getElementById('oracle').onclick=oracleTrial;document.getElementById('reveal').onclick=reveal}

function oracleTrial(){musicSet('oracle');
  /* Ispirato al meccanismo di un piccolo oracolo a carte: pensa alla domanda, pesca una carta e lascia che il responso sia simbolico. Testi e carte sono originali. */
  const deck=[
    ['La Chiave','Una porta che sembrava chiusa potrebbe non esserlo. Prova una strada diversa.'],
    ['Il Ponte','Non devi scegliere tra due rive: cerca ciò che le collega.'],
    ['La Lanterna','Non serve vedere tutto. Ti basta illuminare il prossimo passo.'],
    ['Il Cavaliere','Muoviti quando senti che è il momento. L’attesa non è sempre prudenza.'],
    ['La Corona','Non aspettare che qualcun altro ti autorizzi a scegliere.'],
    ['La Torre','Qualcosa di troppo rigido chiede di essere guardato da un’altra prospettiva.'],
    ['Il Bosco','La strada più evidente non è necessariamente quella giusta.'],
    ['La Fonte','Torna a ciò che ti fa respirare. Da lì riparti.'],
    ['La Spada','Taglia il superfluo. Una decisione netta può liberare spazio.'],
    ['Il Guanto','Accetta l’occasione, ma ricorda che ogni dono porta una responsabilità.'],
    ['La Maschera','Qualcosa non è come appare. Osserva prima di giudicare.'],
    ['Il Corvo','Una notizia inattesa potrebbe cambiare il significato di ciò che già sai.'],
    ['La Rosa','La delicatezza non è debolezza. A volte è la scelta più coraggiosa.'],
    ['Il Labirinto','Non cercare subito l’uscita: prima capisci dove ti trovi.'],
    ['Il Sigillo','Una promessa vale davvero quando viene scelta, non quando viene imposta.'],
    ['La Clessidra','Non forzare il tempo. Alcune risposte arrivano solo quando smetti di inseguirle.'],
    ['Il Lupo','Fidati del tuo istinto, ma non confonderlo con la paura.'],
    ['Il Viandante','Partire senza conoscere tutta la strada è comunque partire.'],
    ['La Luna','Non tutto ciò che senti deve essere spiegato subito.'],
    ['Il Sole','C’è qualcosa che sai già, ma che stai cercando di complicare.'],
    ['La Bilancia','Metti sul piatto anche ciò che desideri, non solo ciò che temi.'],
    ['Il Libro','Una risposta potrebbe essere nascosta in qualcosa che hai già imparato.'],
    ['La Porta','Non chiederti soltanto dove conduce. Chiediti perché vuoi attraversarla.'],
    ['La Fiamma','Proteggi ciò che ti accende, ma non lasciare che ti consumi.'],
    ['Il Coraggio','Non significa non avere paura. Significa scegliere nonostante la paura.'],
    ['Il Giullare','Prendi meno sul serio ciò che non merita di pesarti addosso.'],
    ['La Nave','Un cambiamento è già cominciato, anche se la riva sembra ancora vicina.'],
    ['La Stella','Conserva una direzione, anche quando il percorso cambia.'],
    ['Il Cervo','La prudenza può essere una forma di forza.'],
    ['Il Drago','Non scappare davanti a ciò che sembra enorme: forse è solo la tua prossima prova.'],
    ['Il Dono','Qualcosa arriva quando smetti di misurare quanto meriti di ricevere.'],
    ['Il Cerchio','Una storia può ricominciare senza essere identica a prima.']
  ];
  let question='';
  gameShell('Il Piccolo Oracolo',`<div class="story center"><div class="reveal">✦ IL PICCOLO ORACOLO ✦</div><p>Fermati un momento. Pensa a una domanda. Non devi scriverla e non devi dirla a nessuno.</p><p>Quando ce l’hai, mescola il destino e pesca una carta.</p><button class="btn gold" id="drawOracle">✦ PESCA UNA CARTA ✦</button><p class="tiny" id="oracleHint">Il responso sarà simbolico: non esistono risposte giuste o sbagliate.</p></div><div class="btns"><button class="btn secondary" id="oback">← TORNA ALLE PROVE</button></div>`);
  document.getElementById('oback').onclick=finals;
  document.getElementById('drawOracle').onclick=()=>{
    const card=deck[Math.floor(Math.random()*deck.length)];
    gameShell('Il Piccolo Oracolo',`<div class="story center"><p class="tiny">Il Codex ha pescato per te…</p><div class="reveal">${esc(card[0])}</div><p>${esc(card[1])}</p><p class="quote">«Non è una sentenza. È un segno. Il significato lo scegli tu.»</p></div><div class="btns"><button class="btn gold" id="odone">TORNA ALLE PROVE</button><button class="btn secondary" id="oretry">↻ PESCA UN’ALTRA CARTA</button></div>`);
    document.getElementById('odone').onclick=finals;
    document.getElementById('oretry').onclick=oracleTrial;
  };
}

function reveal(){musicSet('finale');shell('✦ Il Codex ha deciso ✦',`<p class="reveal">La cronaca di Alec non è ancora stata scritta.</p><p>Perché certe persone non appartengono a una sola storia.</p><p>Sono quelle che passano dalla realtà alla rievocazione, dalla lama al dado, dal personaggio alla persona.</p><p class="quote">E forse il bello è proprio questo: continuare a scrivere la prossima pagina.</p><div class="btns"><button class="btn gold" id="dragon">🐉 GIRA LA PAGINA</button><button class="btn secondary" id="home">Torna all'inizio</button></div>`);document.getElementById('dragon').onclick=()=>{shell('Una pagina… imprevista.',`<div class="dragon">💨 <b>SEI APPENA STATO COLPITO DA UNA PUZZETTA DI DRAGO.</b><br><br>-5 Carisma · +10 danni olfattivi<br>Effetto: disgustato per 3 turni.<br><br>🐉 «SCUSA.»</div><div class="btns"><button class="btn" id="homeAfterDragon">Torna all'inizio</button></div>`);fart();document.getElementById('homeAfterDragon').onclick=home};document.getElementById('home').onclick=home}
function fart(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(110,c.currentTime);o.frequency.exponentialRampToValueAtTime(42,c.currentTime+.65);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.8);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.82)}catch(e){}}
app.addEventListener('click',e=>{if(e.target.id==='open')folio1();else if(e.target.id==='toRoutes')routes();else if(e.target.id==='sword')sword();else if(e.target.id==='chronicle')chronicle();else if(e.target.id==='destiny')destiny();else if(e.target.id==='finals')finals()});
home();
})();
</script>
