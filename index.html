<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il Codex di Alec</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap');
:root{--ink:#332117;--paper:#e8d0a0;--paper2:#c9a66d;--dark:#0b0705;--gold:#a97832;--gold2:#d4aa61;--red:#6f2822;--cream:#f4e5c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b0705;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif}
body{overflow-x:hidden}
button{font:inherit;touch-action:manipulation}
#app{min-height:100vh;min-height:100dvh}
.page{min-height:100vh;min-height:100dvh;padding:18px 12px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 18%,#3a2618 0%,#120b07 55%,#080503 100%)}
.codex{width:min(760px,100%);max-height:calc(100vh - 28px);overflow:auto;padding:34px 24px;border:1px solid #a87935;background:linear-gradient(115deg,#d8bc82,#f0ddb0 42%,#d3b276);box-shadow:0 0 0 7px #160d08,0 0 0 8px #8b622e,0 24px 70px #000c;position:relative}
.codex:before{content:"";position:absolute;inset:11px;border:1px solid #8d653866;pointer-events:none}.codex:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#6d421c18,#fff5 45%,#6d421c18);pointer-events:none}
.inner{position:relative;z-index:1;text-align:center}.kicker{letter-spacing:.2em;text-transform:uppercase;font-family:'Cinzel',Georgia,serif;font-size:.72rem;color:#634425;margin-bottom:14px}h1,h2,h3{font-family:'Cinzel',Georgia,serif;color:#4a2c18}h1{font-size:clamp(2.15rem,9vw,4.2rem);line-height:1.02;margin:0 0 18px;letter-spacing:.02em}h2{font-size:clamp(1.65rem,7vw,2.45rem);line-height:1.08;margin:0 0 14px}h3{font-size:1.18rem}p{font-size:1.12rem;line-height:1.48;margin:11px auto;max-width:650px}.quote{font-style:italic;color:#5e4028}.btns{display:grid;gap:12px;margin-top:24px}.btn{border:1px solid #b48745;background:#2d190f;color:#ead5a5;border-radius:0;padding:15px 14px;min-height:54px;cursor:pointer;box-shadow:0 0 0 1px #4f2d18;letter-spacing:.08em;text-transform:uppercase;font-family:'Cinzel',Georgia,serif;font-size:.9rem}.btn:active{transform:translateY(1px);background:#432414}.btn.secondary{background:#c9a66d;color:#2e1c11}.btn.gold{background:#533018}.btn.danger{background:#64221d}
.routes{display:grid;gap:14px;margin-top:22px}.route{padding:18px;border:1px solid #9a713c;background:#e4c992;text-align:left;box-shadow:inset 0 0 0 1px #f2dfb4}.route h3{margin:0 0 6px}.route p{margin:0;font-size:1rem}.route .btn{margin-top:13px;width:100%}
.status{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 0 15px}.status b{padding:9px 15px;border:1px solid #a77b40;background:#d9bc82;color:#3d2718;font-family:'Cinzel',Georgia,serif;font-weight:500;font-size:.83rem;letter-spacing:.04em}.progress{height:8px;background:#76512c;margin:12px 0;border:1px solid #a97832}.progress>i{display:block;height:100%;background:#c89a4b;width:0%;transition:width .2s}
.game{width:min(900px,100%);min-height:calc(100vh - 28px);min-height:calc(100dvh - 28px);padding:32px 18px 22px;display:flex;flex-direction:column;justify-content:center;border:1px solid #7e562c;background:rgba(11,7,5,.94);box-shadow:0 0 0 8px #0c0805,0 0 0 9px #8a612f,0 20px 70px #000;position:relative;color:#d9c095}.game:before{content:"";position:absolute;inset:10px;border:1px solid #754c2770;pointer-events:none}.game .kicker{color:#79552f}.game h2{color:#b77b36;font-size:clamp(1.7rem,7vw,3rem);text-shadow:0 2px 10px #000}.game .story{padding:20px 15px;border:1px solid #8b612f;background:rgba(20,12,7,.66);box-shadow:inset 0 0 25px #0008}.game .story p{max-width:730px;color:#cba96d;font-size:1.2rem}.choice-list{display:grid;gap:12px;margin-top:20px}.choice{width:100%;text-align:left;border:1px solid #a97938;background:#2a170e;padding:15px 14px;color:#d9bf8c;cursor:pointer;min-height:58px}.choice strong{display:block;margin-bottom:4px;font-family:'Cinzel',Georgia,serif;letter-spacing:.03em}.choice span{opacity:.72}.choice:active{background:#472616}.center{text-align:center}.seal{font-size:4rem;margin:8px}.hidden{display:none!important}.tiny{font-size:.8rem;color:#9b7749}.reveal{font-size:clamp(1.5rem,6vw,2.6rem);font-weight:bold;margin:18px 0;color:#b77932}.dragon{font-size:1.1rem;padding:18px;border:1px dashed #a97832;background:#1c0f09;color:#d9bd88}
#arena{position:relative;height:min(58vh,500px);min-height:320px;border:1px solid #9a6d34;background:radial-gradient(circle,#563a24,#130b07 70%);overflow:hidden;margin-top:15px;box-shadow:inset 0 0 35px #000}.target{position:absolute;width:78px;height:78px;border-radius:50%;border:2px solid #d6aa5e;background:#64251f;color:#f1d59c;font-size:1.8rem;display:grid;place-items:center;box-shadow:0 0 0 4px #c0904c55;cursor:pointer;touch-action:manipulation}.arenaText{position:absolute;inset:0;display:grid;place-items:center;color:#b89561;text-align:center;padding:30px;pointer-events:none;font-size:1.1rem}
.d20{width:150px;height:150px;margin:10px auto}.d20 button{border:0;background:transparent;padding:0;cursor:pointer}.d20 svg{width:150px;height:150px;display:block}
@media(max-width:480px){.page{padding:10px}.codex{max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);min-height:0;padding:28px 14px}.codex:before{inset:6px}p{font-size:1.04rem}.route{padding:15px}.game{max-height:none;min-height:calc(100vh - 20px);min-height:calc(100dvh - 20px);padding:28px 12px 18px}.game .story{padding:16px 12px}.game .story p{font-size:1.08rem}.choice{padding:15px 13px;font-size:1rem}.btn{min-height:56px;font-size:.82rem}.target{width:82px;height:82px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const app=document.getElementById('app');
const state={rooms:{sword:false,chronicle:false,larp:false},finals:{blade:false,d20:false,adventure:false}};
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shell(title,body,extra=''){app.innerHTML=`<div class="page"><main class="codex"><div class="inner"><div class="kicker">Codex di Alec</div><h2>${title}</h2>${body}${extra}</div></main></div>`}
function gameShell(title,body){app.innerHTML=`<div class="page"><main class="game"><div class="kicker">🏰 Codex di Alec · cronaca interattiva</div><h2>${title}</h2>${body}</main></div>`}
function home(){shell('Il Codex di Alec',`<p class="quote">CODICE DELLE CRONACHE PERDUTE</p><p>Qui comincia la cronaca di Alec, persona che attraversa i secoli, impugna lame forgiate nel passato e osa entrare in mondi che altri possono soltanto immaginare.</p><div class="btns"><button class="btn gold" id="open">✦ APRI IL CODEX ✦</button></div>`)}
function folio1(){shell('Foglio I · Le cronache',`<p>Le pagine sono incomplete.</p><p>Si racconta di una persona che conosce la lama, la rievocazione e i mondi in cui una storia non si limita a essere raccontata: si vive.</p><p class="quote">Ma una cronaca non si completa leggendo. Si completa scegliendo.</p><div class="btns"><button class="btn gold" id="toRoutes">CONTINUA LA CRONACA →</button></div>`)}
function routes(){const done=Object.values(state.rooms).filter(Boolean).length;let locked=done<3; shell('Foglio II · Le tre vie',`<p>Scegli una via. Puoi affrontarle nell'ordine che preferisci.</p><div class="routes"><section class="route"><h3>⚔️ La Sala d'Armi</h3><p>Un duello di riflessi. Colpisci il bersaglio prima che il tempo scada.</p><button class="btn" id="sword">ENTRA NELLA SALA</button></section><section class="route"><h3>📜 La Cronaca del Castello</h3><p>Un'avventura a scelta multipla. Le tue decisioni cambieranno il percorso.</p><button class="btn" id="chronicle">INIZIA LA CRONACA</button></section><section class="route"><h3>🎭 Il Portale dei Viventi</h3><p>Una piccola avventura LARP: interpreta il personaggio e scegli il destino.</p><button class="btn" id="larp">ATTRAVERSA IL PORTALE</button></section></div><div class="btns">${locked?`<p class="tiny">Completa tutte e tre le vie per sbloccare le prove finali.</p>`:`<button class="btn gold" id="finals">✦ LE TRE PROVE FINALI ✦</button>`}</div>`)}
function sword(){let hits=0,miss=0,timer=null,active=false;gameShell('Sala d’Armi',`<div class="status"><b id="score">Colpi: 0/5</b><b id="miss">Errori: 0/3</b><b id="time">Tempo: 8.0</b></div><div class="progress"><i id="bar"></i></div><div id="arena"><div class="arenaText" id="hint">Premi AVVIA DUELLO. Il bersaglio comparirà nell'arena.</div></div><div class="btns"><button class="btn gold" id="start">⚔️ AVVIA DUELLO</button><button class="btn secondary" id="back">← TORNA ALLE TRE VIE</button></div>`);const arena=document.getElementById('arena'),hint=document.getElementById('hint'),start=document.getElementById('start');function end(win){active=false;if(timer)clearInterval(timer);arena.querySelectorAll('.target').forEach(x=>x.remove());if(win){state.rooms.sword=true;hint.innerHTML='<b>DUELLO VINTO!</b><br>La lama ha parlato.';start.textContent='⚔️ GIOCA DI NUOVO';start.onclick=begin;}else{hint.innerHTML='<b>SEI STATO SCONFITTO.</b><br>La sala concede un altro tentativo.';start.textContent='↻ RIPROVA';start.onclick=begin}}function spawn(){if(!active)return;const t=document.createElement('button');t.className='target';t.type='button';t.textContent='⚔';t.style.left=(Math.random()*(arena.clientWidth-90)+7)+'px';t.style.top=(Math.random()*(arena.clientHeight-90)+7)+'px';t.addEventListener('pointerdown',e=>{e.preventDefault();if(!active)return;hits++;t.remove();document.getElementById('score').textContent=`Colpi: ${hits}/5`;if(hits>=5){end(true)}else spawn()},{passive:false});arena.appendChild(t)}function begin(){hits=0;miss=0;active=true;let left=8;start.disabled=true;hint.textContent='COLPISCI IL BERSAGLIO!';document.getElementById('score').textContent='Colpi: 0/5';document.getElementById('miss').textContent='Errori: 0/3';document.getElementById('time').textContent='Tempo: 8.0';spawn();timer=setInterval(()=>{left-=.1;document.getElementById('time').textContent='Tempo: '+Math.max(0,left).toFixed(1);document.getElementById('bar').style.width=(left/8*100)+'%';if(left<=0)end(false)},100)}arena.addEventListener('pointerdown',e=>{if(!active||e.target.classList.contains('target'))return;miss++;document.getElementById('miss').textContent=`Errori: ${miss}/3`;if(miss>=3)end(false)},{passive:true});document.getElementById('back').onclick=routes}
const nodes={
start:{text:'Il portone del castello è chiuso. Un messaggero ti affida una lettera sigillata. “Deve arrivare al capitano prima del tramonto.” Davanti a te ci sono tre possibilità.',choices:[['Andare verso le mura','walls'],['Seguire il sentiero nel bosco','forest'],['Provare a entrare dalla cucina','kitchen']]},
walls:{text:'Sulle mura trovi una guardia. Ti squadra e indica la lettera. “Chi ti manda?”',choices:[['Dire la verità','truth'],['Inventare un nome nobile','lie'],['Chiedere di parlare con il capitano','captain']]},
forest:{text:'Nel bosco senti un rumore dietro di te. Potrebbe essere un animale. Potrebbe essere qualcuno.',choices:[['Continuare senza voltarti','continue'],['Nasconderti e osservare','hide'],['Gridare “CHI VA LÀ?”','shout']]},
kitchen:{text:'La cucina è piena di servi. Una cuoca ti nota e ti chiede perché stai cercando di passare.',choices:[['Chiedere gentilmente di passare','kind'],['Offrire una moneta','coin'],['Dire che sei l’ispettore delle torte','cake']]},
truth:{text:'La guardia ascolta. Riconosce il sigillo e ti lascia passare. Ma il capitano non è sulla torre: indica una scala che scende nei sotterranei.',choices:[['Scendere','dungeon'],['Chiedere dove porta la scala','ask']]},
lie:{text:'La guardia solleva un sopracciglio. “Certo. E io sono il re.” Ti blocca.',choices:[['Ammettere di aver mentito','truth'],['Scappare verso le scale','escape']]},
captain:{text:'La guardia annuisce. “Ottima idea.” Un soldato viene a chiamare il capitano.',choices:[['Aspettare','wait']]},
continue:{text:'Il rumore era un cervo. Poco più avanti trovi una scorciatoia che porta al castello.',choices:[['Prendere la scorciatoia','shortcut']]},
hide:{text:'Ti nascondi. Passano due esploratori del castello. Uno lascia cadere una chiave.',choices:[['Raccogliere la chiave','key'],['Lasciarla e continuare','shortcut']]},
shout:{text:'“CHI VA LÀ?” urli. Il bosco risponde con un silenzio molto giudicante. Poi senti un ramo spezzarsi.',choices:[['Correre','run'],['Restare fermo','still']]},
kind:{text:'La cuoca sorride. “Passa pure, messaggero.” Hai evitato un disastro diplomatico.',choices:[['Proseguire','hall']]},
coin:{text:'La cuoca guarda la moneta. Poi guarda te. “Ne servono due.”',choices:[['Pagare','hall'],['Rinunciare','forest']]},
cake:{text:'La cuoca ti fissa. “Ispettore delle torte?” È chiaramente la bugia peggiore mai pronunciata nel castello.',choices:[['Confessare','kind'],['Insistere','bad']]},
ask:{text:'La guardia risponde: “Al cuore del castello.” Non sembra voler aggiungere altro.',choices:[['Scendere','dungeon'],['Tornare indietro','walls']]},
escape:{text:'Corri. La guardia urla. Giri l’angolo e trovi un vicolo cieco.',choices:[['Tornare indietro','walls']]},
wait:{text:'Il capitano arriva. Guarda il sigillo, prende la lettera e sorride. Missione compiuta.',choices:[['Concludi la cronaca','win']]},
shortcut:{text:'La scorciatoia sbuca dietro il castello. Una porta secondaria è socchiusa.',choices:[['Entrare','hall']]},
key:{text:'La chiave apre una piccola porta nascosta. Dentro c’è un corridoio che porta al cuore del castello.',choices:[['Entrare','hall']]},
run:{text:'Corri e perdi la strada. Dopo qualche minuto torni esattamente al punto di partenza.',choices:[['Riprovare','start']]},
still:{text:'Rimani immobile. Il “mostro” è un gatto. Ti guarda come se avessi perso tempo prezioso.',choices:[['Seguire il gatto','shortcut']]},
hall:{text:'Nel corridoio incontri un araldo. “Se cerchi il capitano, è nella sala del trono.”',choices:[['Andare alla sala del trono','win'],['Chiedere indicazioni dettagliate','detailed']]},
detailed:{text:'L’araldo indica una porta, poi un’altra, poi una scala. In qualche modo riesci a non perderti.',choices:[['Seguire le indicazioni','win']]},
dungeon:{text:'Nei sotterranei trovi una scala nascosta che porta direttamente alla sala del trono.',choices:[['Salire','win']]},
bad:{text:'La cuoca chiama le guardie. Fine della carriera da ispettore delle torte.',choices:[['Riprovare la cronaca','start']]}
};
function chronicle(){let node='start';gameShell('La Cronaca del Castello',`<div class="status"><b id="chapter">Foglio 1</b><b>Vite: ∞</b></div><div class="story"><p id="story"></p><div class="choice-list" id="choices"></div></div><div class="btns"><button class="btn secondary" id="routeBack">← TORNA ALLE TRE VIE</button></div>`);const story=document.getElementById('story'),choices=document.getElementById('choices');function render(){const n=nodes[node];story.textContent=n.text;choices.innerHTML='';n.choices.forEach(([label,next])=>{const b=document.createElement('button');b.className='choice';b.type='button';b.innerHTML='<strong>'+esc(label)+'</strong><span>→ Scegli questa strada</span>';b.addEventListener('click',()=>{if(next==='win'){state.rooms.chronicle=true;win()}else node=next;render()});choices.appendChild(b)});document.getElementById('chapter').textContent='Foglio '+(Object.keys(nodes).indexOf(node)+1)}function win(){story.innerHTML='<b>✦ MISSIONE COMPIUTA ✦</b><br><br>La lettera è arrivata nelle mani del capitano. La tua cronaca entra nel Codex.';choices.innerHTML='<button class="btn gold" id="again">↻ RISCRIVI LA CRONACA</button><button class="btn" id="done">TORNA ALLE TRE VIE</button>';document.getElementById('again').onclick=()=>{node='start';render()};document.getElementById('done').onclick=routes}document.getElementById('routeBack').onclick=routes;render()}
const larpNodes={start:['Il portale si apre. Sei davanti a un villaggio assediato. Una persona ti chiede aiuto.','Parlare con chi chiede aiuto','Andare verso le mura'],help:['Ti racconta che una reliquia è stata rubata. Nessuno sa chi l’abbia presa.','Accettare la missione','Rifiutare e andare al villaggio'],walls:['Sulle mura vedi un simbolo sospetto. Una guardia vuole che tu scelga rapidamente.','Seguire il simbolo','Avvertire la guardia'],relic:['Il simbolo conduce a una cappella abbandonata. La reliquia è lì, ma qualcuno ti sta aspettando.','Affrontarlo','Provare a parlarci'],talk:['La persona sorride: “Finalmente qualcuno che ragiona.” Ti indica una via segreta.','Seguirla','Chiedere chi sia'],final:['La via segreta conduce al centro del villaggio. La reliquia viene restituita e il villaggio è salvo.','Concludere l’avventura','Tornare indietro']};
function larp(){let n='start';gameShell('Il Portale dei Viventi',`<div class="status"><b id="scene">Scena 1/4</b><b>Cuore: ♥♥♥</b></div><div class="story"><p id="lt"></p><div class="choice-list" id="lc"></div></div><div class="btns"><button class="btn secondary" id="lb">← TORNA ALLE TRE VIE</button></div>`);const lt=document.getElementById('lt'),lc=document.getElementById('lc');function r(){if(n==='final'){state.rooms.larp=true;lt.innerHTML='<b>IL VILLAGGIO È SALVO.</b><br><br>Hai completato la tua prima cronaca vivente.';lc.innerHTML='<button class="btn gold" id="again">↻ RIGIOCA</button><button class="btn" id="done">TORNA ALLE TRE VIE</button>';document.getElementById('again').onclick=()=>{n='start';r()};document.getElementById('done').onclick=routes;return}let x=larpNodes[n];lt.textContent=x[0];lc.innerHTML='';[[x[1],next(n,0)],[x[2],next(n,1)]].forEach(([lab,to])=>{const b=document.createElement('button');b.className='choice';b.textContent=lab;b.onclick=()=>{n=to;r()};lc.appendChild(b)});document.getElementById('scene').textContent='Scena '+(n==='start'?1:n==='help'||n==='walls'?2:n==='relic'||n==='talk'?3:4)+'/4'}function next(node,i){if(node==='start')return i?'walls':'help';if(node==='help')return i?'start':'relic';if(node==='walls')return i?'help':'relic';if(node==='relic')return i?'talk':'final';if(node==='talk')return i?'help':'final';return 'final'}document.getElementById('lb').onclick=routes;r()}
function finals(){const count=Object.values(state.finals).filter(Boolean).length;gameShell('Foglio III · Le tre prove',`<p>Le tre vie sono state percorse. Ora il Codex chiede le prove finali.</p><div class="routes"><section class="route"><h3>⚔️ Prova della Lama</h3><p>Tre colpi. Devi scegliere il momento giusto.</p><button class="btn" id="blade">AFFRONTA LA PROVA</button><span class="tiny" id="bs"></span></section><section class="route"><h3>🎲 Prova del Destino</h3><p>Un vero D20 decide il risultato.</p><div class="d20"><button id="roll" aria-label="Lancia il D20"><svg viewBox="0 0 160 160" role="img"><polygon points="80,8 146,52 122,132 38,132 14,52" fill="#7e2c26" stroke="#e6c477" stroke-width="5"/><path d="M80 8 80 132M14 52 122 132M146 52 38 132M14 52 146 52" stroke="#e6c477" stroke-width="3" fill="none"/><text x="80" y="91" text-anchor="middle" font-size="34" fill="#fff2cf" font-family="Georgia">20</text></svg></button></div><div class="center" id="ds"></div></section><section class="route"><h3>🗝️ Prova dell’Avventuriero</h3><p>Tre porte. Una sola conduce al tesoro.</p><button class="btn" id="adventure">SCEGLI UNA PORTA</button><div id="as" class="tiny"></div></section></div><div class="btns"><button class="btn secondary" id="rb">← TORNA ALLE TRE VIE</button>${count>=3?'<button class="btn gold" id="reveal">✦ IL CODEX HA DECISO ✦</button>':''}</div>`);document.getElementById('rb').onclick=routes;document.getElementById('roll').onclick=()=>{const v=Math.floor(Math.random()*20)+1;document.getElementById('ds').textContent='Il dado mostra '+v+'.';if(v>=12)state.finals.d20=true;else document.getElementById('ds').textContent+=' Il destino chiede un altro lancio.';finals()};let bladeHits=0;document.getElementById('blade').onclick=()=>{bladeHits++;if(bladeHits>=3)state.finals.blade=true;document.getElementById('bs').textContent=state.finals.blade?' ✓ Prova superata.':' '+bladeHits+'/3 colpi centrati.';};document.getElementById('adventure').onclick=()=>{const v=Math.floor(Math.random()*3);document.getElementById('as').textContent=v===0?'❌ Porta sbagliata. Riprova.':'✓ Hai trovato il tesoro.';if(v!==0)state.finals.adventure=true;if(Object.values(state.finals).every(Boolean)){setTimeout(finals,250)}};if(count>=3)document.getElementById('reveal').onclick=reveal}
function reveal(){shell('✦ Il Codex ha deciso ✦',`<p class="reveal">La cronaca di Alec non è ancora stata scritta.</p><p>Perché certe persone non appartengono a una sola storia.</p><p>Sono quelle che passano dalla realtà alla rievocazione, dalla lama al dado, dal personaggio alla persona.</p><p class="quote">E forse il bello è proprio questo: continuare a scrivere la prossima pagina.</p><div class="btns"><button class="btn gold" id="dragon">🐉 GIRA LA PAGINA</button><button class="btn secondary" id="home">Torna all'inizio</button></div>`);document.getElementById('dragon').onclick=()=>{shell('Una pagina… imprevista.',`<div class="dragon">💨 <b>SEI APPENA STATO COLPITO DA UNA PUZZETTA DI DRAGO.</b><br><br>-5 Carisma · +10 danni olfattivi<br>Effetto: disgustato per 3 turni.<br><br>🐉 «SCUSA.»</div><div class="btns"><button class="btn" id="home">Torna all'inizio</button></div>`);fart()};document.getElementById('home').onclick=home}
function fart(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(110,c.currentTime);o.frequency.exponentialRampToValueAtTime(42,c.currentTime+.65);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.25,c.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.8);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.82)}catch(e){}}
